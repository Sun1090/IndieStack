packages:
  - "."
  - "docs-site"

# 允许执行安装构建脚本的依赖（pnpm v11 字段，默认 strictDepBuilds=true 会阻止未审批脚本）
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true

# 依赖覆盖：修复审计发现的传递依赖漏洞（pnpm v11 设置在 pnpm-workspace.yaml）
overrides:
  # 同上：先前钉的 ^3.1.6 在新 advisory 下自身已是漏洞版本（需 >=3.1.8）
  fast-uri: ^3.1.8
  nanoid: ^3.3.18
  # GHSA-qhr7-859c-m2p7 / GHSA-6j4f-fj2g-mc7p：DoS via uncontrolled recursion。
  # 2026-09-30 上调：先前钉的 ^2.1.4 / ^5.0.9 在新 advisory 下**自身已是漏洞版本**
  # （2.x 需 >=2.1.6，5.x 需 >=5.0.11），所以这条 override 一直绿着而 audit 一直红着。
  'brace-expansion@>=1.0.0 <2.0.0': ^2.1.7
  'brace-expansion@>=2.0.0 <3.0.0': ^2.1.7
  'brace-expansion@>=5.0.0': ^5.0.12
  js-yaml: ^4.3.2
  '@sentry/webpack-plugin>uuid': ^11.1.1
  'vitepress>vite': ^6.4.3
  postcss: ^8.5.23
  # 2026-10-06：两个新 advisory，都有上游修复版本，所以按本仓库既有做法走 override
  #（与上面 fast-uri / brace-expansion 同理），而不是登记进 DEPENDENCY_AUDIT_EXCEPTIONS
  # ——例外表是给「上游根本没有可升级版本」用的。
  # **braces 不在此列**：它的 advisory 编号没变（仍是 GHSA-vfj7-8cjw-p6…，
  # 已登记在 DEPENDENCY_AUDIT_EXCEPTIONS），只是 npm audit 的本地 id 变了；
  # 且上游 3.0.4 至今未发布。第一版这里错加了 override，装依赖时直接失败才发现。
  # source-map-js：GHSA-68fv-2mgg-jv7q，需 >=1.2.2（经 postcss / webpack / vite 传递引入）
  source-map-js: ^1.2.2
  # @vue/server-renderer：GHSA-g2v6-rqmx-r4w6，需 >=3.5.42（仅 docs-site 的 vitepress 链路）
  '@vue/server-renderer': ^3.5.42
  sharp: ^0.35.0
