packages:
  - "."
  - "docs-site"

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true

# 依赖覆盖：修复审计发现的传递依赖漏洞（pnpm v11 设置在 pnpm-workspace.yaml）
overrides:
  fast-uri: ^3.1.5
  nanoid: ^3.3.18
  'brace-expansion@>=1.0.0 <2.0.0': ^2.1.4
  'brace-expansion@>=2.0.0 <3.0.0': ^2.1.4
  'brace-expansion@>=5.0.0': ^5.0.9
  js-yaml: ^4.3.1
  '@sentry/webpack-plugin>uuid': ^11.1.1
  'vitepress>vite': ^6.4.3
  postcss: ^8.5.23
  sharp: ^0.35.0
