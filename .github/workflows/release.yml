name: Release

## 推送 v* 标签时自动创建 GitHub Release
## Release Notes 由上一个标签以来的提交自动生成

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes and create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF}^" 2>/dev/null || echo "")
          ARGS=("--title" "${GITHUB_REF#refs/tags/}" "--generate-notes")
          if [ -n "$PREV_TAG" ]; then
            ARGS+=("--notes-start-tag" "$PREV_TAG")
          fi
          gh release create "${GITHUB_REF#refs/tags/}" "${ARGS[@]}"
