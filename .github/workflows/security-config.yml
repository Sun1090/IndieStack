name: Security and configuration checks

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

# PR 上同一分支的旧运行在推送新提交后立刻取消；push / schedule 事件不取消，
# 保证 main/develop 的扫描结果始终保留。
concurrency:
  group: security-config-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repository security/config checks
        run: pnpm check:security
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: Auth email config drift check
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_PROJECT_REF}" ] || [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::notice::跳过 Auth 邮件配置校验（缺少 SUPABASE_PROJECT_REF / SUPABASE_ACCESS_TOKEN）"
            exit 0
          fi
          # 免费套餐使用默认发件人时无法通过 API 改模板，因此门禁只校验重定向白名单；
          # 配置自定义 SMTP 后应改为 --verify（scope=all）。
          node scripts/apply-auth-email-templates.js --verify --scope=redirects
