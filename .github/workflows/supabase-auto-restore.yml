name: Supabase auto-restore

## 免费版兜底：Supabase 项目若被自动暂停（status=INACTIVE），
## 通过 Management API 自动恢复，避免站点长时间 503。
##
## 与 health-check.yml 的分工：
##   - health-check.yml  只做探测/保活（不写任何远端状态）
##   - 本 workflow        仅在确认 INACTIVE 时执行恢复（写操作）
##
## 需要配置：
##   Variable  HEALTHCHECK_URL        线上 /api/health
##   Variable  SUPABASE_PROJECT_REF   Supabase 项目 ref
##   Secret    SUPABASE_ACCESS_TOKEN  Management API 令牌（sbp_ 开头，projects:write）

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只检测、不执行恢复"
        required: false
        type: boolean
        default: true
  schedule:
    # 排在 Vercel Cron（计划 02:00 UTC）与 health-check（计划 03:17 UTC）之后。
    # 注意「之后」只在**同日相对顺序**意义上成立：GitHub 的 schedule 会晚触发几小时
    # （2026-10-11 取 92 条运行记录实测：本 workflow 的触发时刻落在 08:47–11:47 UTC，
    # 比标称晚 +4.2 ~ +7.2 小时，且逐周递增）。同日的相对顺序在 29 个可比日里 0 次违反，
    # 而这三层兜底要的都是「每天至少跑到一次」，不依赖绝对时刻，所以不需要修 cron 值。
    # 依据与量法见 docs/operations/environments.md「免费版保活与自动恢复」。
    - cron: "37 4 * * *"

permissions:
  contents: read

jobs:
  auto-restore:
    name: Detect paused project and restore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 刻意不安装依赖：脚本只用 Node 内置 API，恢复链路不应被依赖问题拖垮
      - name: Verify configuration
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          missing=""
          [ -z "${HEALTHCHECK_URL}" ] && missing="${missing} HEALTHCHECK_URL"
          [ -z "${SUPABASE_PROJECT_REF}" ] && missing="${missing} SUPABASE_PROJECT_REF"
          [ -z "${SUPABASE_ACCESS_TOKEN}" ] && missing="${missing} SUPABASE_ACCESS_TOKEN"
          if [ -n "${missing}" ]; then
            echo "::error::缺少配置：${missing}（Settings → Secrets and variables → Actions）"
            exit 1
          fi

      # 手动触发默认 dry-run，避免误点造成写操作；定时任务始终执行真实恢复
      - name: Auto-restore
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            node scripts/supabase-auto-restore.js --dry-run
          else
            node scripts/supabase-auto-restore.js
          fi
