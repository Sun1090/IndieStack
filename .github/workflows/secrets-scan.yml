name: Secrets Scan

## gitleaks 密钥泄漏扫描：push / PR 全量 diff 检查

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  gitleaks:
    name: Detect Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
