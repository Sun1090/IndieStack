name: Secrets Scan

## gitleaks 密钥泄漏扫描：push / PR 全量 diff 检查

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# PR 上同一分支的旧运行在推送新提交后立刻取消；push / schedule 事件不取消，
# 保证 main/develop 的扫描结果始终保留。
concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Detect Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
