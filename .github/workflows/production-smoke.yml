name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      url:
        description: Production base URL
        required: true
        default: https://indie-stack-theta.vercel.app
        type: string
      expected_version:
        description: Expected application version (optional)
        required: false
        default: ""
        type: string
      expected_commit:
        description: Expected deployed commit SHA, full or short (optional)
        required: false
        default: ""
        type: string
      timeout_ms:
        description: Per-request timeout in milliseconds
        required: true
        default: "10000"
        type: string
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  smoke:
    name: Side-effect-free production smoke
    # `on:` 的 schedule 作用于所有作业，而本作业的参数全部来自 workflow_dispatch inputs：
    # 定时触发时 inputs 为空，脚本会在参数解析上失败且从未访问生产。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production smoke
        shell: bash
        env:
          SMOKE_URL: ${{ inputs.url }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          TIMEOUT_MS: ${{ inputs.timeout_ms }}
        run: |
          args=( "$SMOKE_URL" --timeout-ms "$TIMEOUT_MS" --output production-smoke.json )
          if [[ -n "$EXPECTED_VERSION" ]]; then
            args+=( --expected-version "$EXPECTED_VERSION" )
          fi
          if [[ -n "$EXPECTED_COMMIT" ]]; then
            args+=( --expected-commit "$EXPECTED_COMMIT" )
          fi
          pnpm smoke:production -- "${args[@]}"

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-smoke-evidence
          path: production-smoke.json
          retention-days: 30
          if-no-files-found: warn

  smoke-main:
    name: Daily production version drift check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production version drift
        run: node scripts/check-production-version.js --base-url https://indie-stack-theta.vercel.app

      - name: Upload drift evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-version-drift-evidence
          path: production-smoke.json
          retention-days: 30
          if-no-files-found: warn

  # 「生产落后 main 多少个提交」与版本漂移是**两件事**，所以分成两个作业：
  # 合并在一起会让「部署滞后」的红盖住「版本漂移」的结果，反之亦然。
  #
  # 为什么要单独加这条：`smoke-main` 会**打印**生产跑的 commit，但不断言它
  # （`expected_commit` 只在 workflow_dispatch 时能传）。2026-10-05 实测到这个状态——
  # Vercel 构建配额限流，生产停在 08dd6f17 而 main 已是 30f8e896（差 5 个提交），
  # 而当天这个作业一路绿。**没有任何自动检查会注意到生产停在旧构建上。**
  #
  # 判定的是**距离**而不是相等：部署滞后是常态，断言相等会天天误报，
  # 而天天误报的检查等于没有检查。阈值以内的落后判通过但**记下距离**，
  # 连续多天同一距离不回落才是真问题。
  deploy-freshness:
    name: Production deploy freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # 刻意要全历史：`git rev-list --count <生产commit>..origin/main` 需要算距离，
          # 浅克隆（默认 fetch-depth: 1）算不出来，而算不出来会被判成「未知且不通过」——
          # 那样这条作业会天天红，且红的原因藏在 checkout 参数里。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production deploy freshness
        run: node scripts/check-deploy-freshness.js --base-url https://indie-stack-theta.vercel.app
