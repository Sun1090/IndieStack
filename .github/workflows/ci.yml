name: CI
## CI 工作流
## 每次 push 到 main/develop 或 PR 到 main/develop 时运行

permissions:
  contents: read

# 同一 PR 的重复推送只保留最新一次运行：被取代的运行立刻取消，既不继续占用 runner，
# 也不会在过时代码上给出误导性的状态。main/develop push 与 schedule 不取消，
# 因此 cancel-in-progress 只在 pull_request 事件为 true。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency security audit
        run: pnpm audit --audit-level high

      # 一份清单：lint / type-check / 单测与全部 `check:*` 门禁只由 `scripts/check-all.sh` 列举。
      # CI 过去逐项写步骤，于是本地聚合与 CI 是两份手工清单——历史上确实出现过
      # 「只存在于本地」和「只存在于 CI」的门禁（`check:gates` 就是为此而存在的）。
      # 聚合脚本 `set -e` 且在每一步前打印 `==> <门禁>`，失败日志的最后一条就是失败的门禁。
      - name: Run every repository gate
        run: pnpm check:all

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # test:coverage 在 CI 同步 enforce 覆盖率门禁（branches 90%），
      # 并产出 coverage/ 供下方 artifact 上传（消除空路径告警）。
      # 独立成 job：覆盖率与静态门禁并行，构建与 E2E 只等静态门禁，
      # 不必再为一次覆盖率运行多等一两分钟。
      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload test coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-type-check]

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create env file
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}" >> .env.local
          echo "NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}" >> .env.local

      - name: Build
        run: pnpm build

      # 直接读 .next/static，不重复构建：客户端包体积基线此前只在本地 verify:build 生效
      - name: Bundle size baseline
        run: node scripts/check-bundle.js

      - name: a11y static audit
        run: pnpm check:a11y

      - name: Bundle performance assertions
        run: node scripts/check-perf.js

  build-docs:
    name: Build Docs Site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: ./docs-site
        run: pnpm --filter indiestack-docs build

  e2e:
    name: E2E shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-type-check]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 浏览器二进制按锁文件哈希缓存（Playwright 版本变化即失效）；
      # --with-deps 仍会补齐系统依赖，只省去每次重新下载浏览器。
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests (shard ${{ matrix.shard }}/2)
        run: pnpm test:e2e --shard=${{ matrix.shard }}/2

      - name: Run visual regression baselines
        if: matrix.shard == 1
        run: pnpm test:visual

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          # test-results/ holds the actual/diff PNGs written by failed
          # toHaveScreenshot assertions (visual regression evidence).
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Branch protection requires one stable, non-matrix context. Matrix job names
  # receive a shard suffix on GitHub, so aggregate both shards into this gate.
  e2e-gate:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [e2e]
    steps:
      - name: Require every E2E shard to pass
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: test "$E2E_RESULT" = "success"
