name: CI
## CI 工作流
## 每次 push 到 main/develop 或 PR 到 main/develop 时运行

permissions:
  contents: read

# 同一 PR 的重复推送只保留最新一次运行：被取代的运行立刻取消，既不继续占用 runner，
# 也不会在过时代码上给出误导性的状态。main/develop push 与 schedule 不取消，
# 因此 cancel-in-progress 只在 pull_request 事件为 true。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency security audit
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Check i18n locale symmetry
        run: pnpm check:locales

      - name: Check i18n translation usage
        run: pnpm check:i18n

      - name: Check shared agent index
        run: pnpm check:agents

      - name: Check docs-site script sync
        run: pnpm check:docs

      - name: Check RLS migrations
        run: pnpm check:rls

      - name: Check migration ordering and drift hazards
        run: pnpm check:migrations

      - name: Check migration rollback runbook
        run: pnpm check:migration-runbook

      - name: Check Supabase security boundaries
        run: pnpm check:supabase-security

      - name: Check repository security configuration
        run: pnpm check:security

      - name: Check release documentation
        run: pnpm check:release-docs

      - name: Check CHANGELOG structure
        run: pnpm check:changelog

      - name: Check ADR governance
        run: pnpm check:adr

      - name: Check gate wiring
        run: pnpm check:gates

      - name: Check Mock documentation parity
        run: pnpm check:mock-docs

      - name: Check contributor test matrix parity
        run: pnpm check:test-matrix

      - name: Check provider documentation parity
        run: pnpm check:provider-docs

      - name: Check Tailwind v4 native theme usage
        run: pnpm check:tailwind

      - name: Check design token consistency
        run: pnpm check:tokens

      - name: Check shared form field usage
        run: pnpm check:fields

      - name: Check shared state usage
        run: pnpm check:states

      - name: Check CI workflow topology
        run: pnpm check:workflows

      - name: Check CodeQL alert policy
        run: pnpm check:codeql

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # test:coverage 在 CI 同步 enforce 覆盖率门禁（branches 90%），
      # 并产出 coverage/ 供下方 artifact 上传（消除空路径告警）。
      # 独立成 job：覆盖率与静态门禁并行，构建与 E2E 只等静态门禁，
      # 不必再为一次覆盖率运行多等一两分钟。
      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload test coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-type-check]

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create env file
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}" >> .env.local
          echo "NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}" >> .env.local

      - name: Build
        run: pnpm build

      - name: a11y static audit
        run: pnpm check:a11y

      - name: Bundle performance assertions
        run: node scripts/check-perf.js

  build-docs:
    name: Build Docs Site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: ./docs-site
        run: pnpm --filter indiestack-docs build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-type-check]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 浏览器二进制按锁文件哈希缓存（Playwright 版本变化即失效）；
      # --with-deps 仍会补齐系统依赖，只省去每次重新下载浏览器。
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests (shard ${{ matrix.shard }}/2)
        run: pnpm test:e2e --shard=${{ matrix.shard }}/2

      - name: Run visual regression baselines
        if: matrix.shard == 1
        run: pnpm test:visual

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          # test-results/ holds the actual/diff PNGs written by failed
          # toHaveScreenshot assertions (visual regression evidence).
          path: |
            playwright-report/
            test-results/
          retention-days: 7
