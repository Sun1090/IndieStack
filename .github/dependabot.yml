version: 2
updates:
  # 主应用与文档站依赖（pnpm workspace）
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # 运行时是 Node 22（.nvmrc / engines.node / CI），@types/node 不得越过运行时大版本，
    # 否则类型会放行 Node 22 上不存在的 API，问题只在运行时暴露
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions 版本跟进
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
